server:
  port: 8080
spring:
  application:
    name: ai-code-review-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicodereview}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-prod-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-engine:
    base-url: ${AI_ENGINE_URL:http://localhost:8000}
  github:
    token: ${GITHUB_TOKEN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
logging:
  level:
    com.aicodereview: INFO
